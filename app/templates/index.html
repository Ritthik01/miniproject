
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Deployment Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #101d35, #174b70);
            color: white;
            text-align: center;
        }
        .container {
            padding: 100px 20px;
        }
        h1 {
            font-size: 42px;
        }
        .card {
            background: white;
            color: #172b4d;
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
        }
        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My DevOps Deployment Project</h1>
        <p>Automated deployment using AWS, Terraform, Docker and Jenkins</p>

        <div class="card">
            <h2>Application Status</h2>
            <p class="status">Website is running successfully!</p>
            <p>CI/CD: Jenkins</p>
            <p>Infrastructure: AWS EC2 + Terraform</p>
            <p>Monitoring: Prometheus + Grafana</p>
        </div>
    </div>
</body>
</html>
